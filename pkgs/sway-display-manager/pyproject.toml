[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sway-display-manager"
version = "0.0.1"
description = "Custom Sway display manager"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "i3ipc>=2.2.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
swaydm = "swaydm.main:main"
